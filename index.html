<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruDeals Open Dashboard - Payment Demo</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .card-row {
      display: flex;
      gap: 10px;
    }

    .card-row input {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Payment Demo</h2>
    <form id="paymentForm">
      <input type="text" placeholder="First Name" required>
      <input type="text" placeholder="Last Name" required>
      <input type="email" placeholder="Email" required>
      <input type="tel" placeholder="Phone Number" required>
      <input type="text" placeholder="Card Number" required>
      <div class="card-row">
        <input type="text" placeholder="CVV" required>
        <input type="text" placeholder="Expiry Date (MM/YY)" required>
      </div>
      <!-- Pay button triggers custom URL scheme -->
      <a href="trudeals://app/payment/success?token=abcdefg_token" id="payButton">
        <button type="button">Pay</button>
      </a>
    </form>
  </div>
</body>
</html>
