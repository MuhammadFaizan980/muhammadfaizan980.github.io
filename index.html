<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruDeals Payment Demo</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 350px;
    }

    h2 { text-align: center; margin-bottom: 20px; }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .card-row { display: flex; gap: 10px; }
    .card-row input { flex: 1; padding: 10px; }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
    }

    .modal-content button {
      margin-top: 20px;
      background-color: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Payment Demo</h2>
    <form id="paymentForm">
      <input type="text" placeholder="First Name" required>
      <input type="text" placeholder="Last Name" required>
      <input type="email" placeholder="Email" required>
      <input type="tel" placeholder="Phone Number" required>
      <input type="text" placeholder="Card Number" required>
      <div class="card-row">
        <input type="text" placeholder="CVV" required>
        <input type="text" placeholder="Expiry Date (MM/YY)" required>
      </div>
      <button type="button" id="payButton">Pay</button>
    </form>
  </div>

  <!-- Modal -->
  <div class="modal" id="successModal">
    <div class="modal-content">
      <h3>Payment Successful!</h3>
      <p>Your payment has been processed successfully.</p>
      <a href="trudeals://app/payment?status=success&token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2ODZhMzRlN2E3Y2U0MjRkYWRkOGI2NWUiLCJpc0FkbWluIjpmYWxzZSwiaWF0IjoxNzU5OTk5MDEwLCJleHAiOjE3NjI1OTEwMTB9.eq_ABJRv4ZKByyzIfBPUk78TAYCzlqckcpMuFsoyuvM">
        <button id="closeButton">Success</button>
      </a>
        <a href="trudeals://app/payment?status=fail">
        <button id="closeButton">Error</button>
      </a>
    </div>
  </div>

  <script>
    const payButton = document.getElementById('payButton');
    const modal = document.getElementById('successModal');

    payButton.addEventListener('click', () => {
      modal.style.display = 'flex';
    });
  </script>
</body>
</html>
